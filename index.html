<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohit AI Video Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            margin-top: 30px;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
        }
        textarea {
            width: 90%;
            height: 100px;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 8px;
            padding: 10px;
            font-size: 15px;
            resize: none;
            margin-top: 15px;
        }
        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover {
            background: #0369a1;
        }
        .video-box {
            margin-top: 25px;
            width: 100%;
            height: 250px;
            background: #0f172a;
            border: 2px dashed #334155;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Mohit AI Video Generator</h1>
        <p>Apna idea niche likho aur AI se video banao</p>
        
        <textarea placeholder="Example: A futuristic car driving through a glowing cyberpunk city..."></textarea>
        <br>
        <button onclick="generateVideo()">Generate AI Video 🎬</button>

        <div class="video-box" id="resultBox">
            Aapki video yahan dikhegi
        </div>
    </div>

    <script>
        function generateVideo() {
            document.getElementById('resultBox').innerHTML = "<p style='color: #eab308;'>⏳ AI Video Processing... (API Key required)</p>";
        }
    </script>

</body>
</html>
