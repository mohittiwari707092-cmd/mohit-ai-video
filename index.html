<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohit AI Video Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            margin-top: 20px;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 8px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 0;
        }
        input[type="password"], textarea {
            width: 90%;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
            margin-top: 10px;
            box-sizing: border-box;
        }
        textarea {
            height: 90px;
            resize: none;
        }
        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
            transition: 0.3s;
            width: 90%;
        }
        button:hover {
            background: #0369a1;
        }
        .video-box {
            margin-top: 20px;
            width: 100%;
            min-height: 250px;
            background: #0f172a;
            border: 2px dashed #334155;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            overflow: hidden;
        }
        video {
            width: 100%;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Mohit AI Video Generator</h1>
        <p>Apna idea aur Replicate API Key daal kar video banao</p>
        
        <input type="password" id="apiKey" placeholder="Paste Replicate API Key (r8_...) here">
        <textarea id="promptInput" placeholder="Example: A futuristic car driving through a glowing cyberpunk city..."></textarea>
        
        <button onclick="generateVideo()">Generate AI Video 🎬</button>

        <div class="video-box" id="resultBox">
            Aapki video yahan dikhegi
        </div>
    </div>

    <script>
        async function generateVideo() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const prompt = document.getElementById('promptInput').value.trim();
            const resultBox = document.getElementById('resultBox');

            if (!apiKey) {
                alert('Kripya pehle apni Replicate API Key daalein!');
                return;
            }
            if (!prompt) {
                alert('Kripya video ka prompt/idea likhein!');
                return;
            }

            resultBox.innerHTML = "<p style='color: #eab308;'>⏳ AI Video Processing... Isme 1-2 minute lag sakte hain.</p>";

            try {
                const response = await fetch("https://corsproxy.io/?" + encodeURIComponent("https://api.replicate.com/v1/predictions"), {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        version: "3f0443ed537e2c9f5383505c08f407dd9f518e983416a445d429a8f4c2e680d6",
                        input: { prompt: prompt }
                    })
                });

                const data = await response.json();

                if (data.error) {
                    resultBox.innerHTML = `<p style='color: #ef4444;'>Error: ${data.error}</p>`;
                    return;
                }

                checkStatus(data.id, apiKey);
            } catch (err) {
                resultBox.innerHTML = "<p style='color: #ef4444;'>Request fail ho gayi. Key aur connection check karein.</p>";
            }
        }

        async function checkStatus(predictionId, apiKey) {
            const resultBox = document.getElementById('resultBox');
            
            const interval = setInterval(async () => {
                try {
                    const res = await fetch("https://corsproxy.io/?" + encodeURIComponent(`https://api.replicate.com/v1/predictions/${predictionId}`), {
                        headers: { "Authorization": `Bearer ${apiKey}` }
                    });
                    const statusData = await res.json();

                    if (statusData.status === "succeeded") {
                        clearInterval(interval);
                        const videoUrl = statusData.output[0] || statusData.output;
                        resultBox.innerHTML = `<video controls autoplay loop src="${videoUrl}"></video>`;
                    } else if (statusData.status === "failed") {
                        clearInterval(interval);
                        resultBox.innerHTML = "<p style='color: #ef4444;'>Video generation fail ho gaya. Dusra prompt try karein.</p>";
                    }
                } catch (e) {
                    clearInterval(interval);
                    resultBox.innerHTML = "<p style='color: #ef4444;'>Status check karne me error aaya.</p>";
                }
            }, 4000);
        }
    </script>

</body>
</html>
